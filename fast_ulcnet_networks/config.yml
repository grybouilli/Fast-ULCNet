# Data parameters
data_parameters:
  fs: 16000
  n_fft: 512
  hop_size: 256
  win_size: 512
  hann_window: True
  compression_factor: 0.3

model_parameters:
  CRM_type: 'E' # Type of Complex-Ratio Mask ['R', 'C' or 'E']
  bidirectional_frnn_units: 64
  sub_band_rnn_units: 128
  temporal_input: False

# Training parameters
training_parameters:
  batch_size: 32
  max_epochs: 300
  eps: 1.e-8
  loss: FastULCNet
  adaptive_lr:
    lr: 1.e-3
    min_lr: 10.e-10
    factor: 0.5 
    patience: 3
    cooldown: 1

  early_stopping:
    patience: 5